<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1d2b"/>
      <stop offset="100%" stop-color="#0f1018"/>
    </linearGradient>
  </defs>

  <!-- terminal window -->
  <rect x="4" y="4" width="232" height="232" rx="30" fill="url(#bg)" stroke="#2c2e3f" stroke-width="2"/>

  <!-- title bar -->
  <circle cx="34" cy="36" r="7" fill="#ff5f56"/>
  <circle cx="56" cy="36" r="7" fill="#ffbd2e"/>
  <circle cx="78" cy="36" r="7" fill="#27c93f"/>
  <line x1="18" y1="56" x2="222" y2="56" stroke="#2c2e3f" stroke-width="2"/>

  <!-- prompt chevron ">" as a solid polygon (chevron shape, not just an outline) -->
  <polygon points="30,84 30,108 62,118 30,128 30,152 96,118" fill="#27c93f"/>
  <!-- cursor underscore "_" -->
  <rect x="106" y="140" width="46" height="14" rx="4" fill="#27c93f"/>

  <!-- multi-OS chips: Debian (red), Fedora (blue), macOS (silver) -->
  <g stroke="#0f1018" stroke-width="3">
    <circle cx="150" cy="178" r="15" fill="#A81D33"/>
    <circle cx="184" cy="178" r="15" fill="#3C6EB4"/>
    <circle cx="167" cy="206" r="15" fill="#D6D6DA"/>
  </g>
</svg>
