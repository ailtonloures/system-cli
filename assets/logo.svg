<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1d2b"/>
      <stop offset="100%" stop-color="#0f1018"/>
    </linearGradient>
  </defs>

  <!-- terminal window -->
  <rect x="4" y="4" width="232" height="232" rx="30" fill="url(#bg)" stroke="#2c2e3f" stroke-width="2"/>

  <!-- title bar -->
  <circle cx="34" cy="36" r="7" fill="#ff5f56"/>
  <circle cx="56" cy="36" r="7" fill="#ffbd2e"/>
  <circle cx="78" cy="36" r="7" fill="#27c93f"/>
  <line x1="18" y1="56" x2="222" y2="56" stroke="#2c2e3f" stroke-width="2"/>

  <!-- simple gear, centered in the terminal body (8 teeth, precomputed coords, no transform) -->
  <polygon points="111.00,90.00 129.00,90.00 129.00,114.00 111.00,114.00" fill="#27c93f"/>
  <polygon points="154.65,100.62 167.38,113.35 150.41,130.32 137.68,117.59" fill="#27c93f"/>
  <polygon points="178.00,139.00 178.00,157.00 154.00,157.00 154.00,139.00" fill="#27c93f"/>
  <polygon points="167.38,182.65 154.65,195.38 137.68,178.41 150.41,165.68" fill="#27c93f"/>
  <polygon points="129.00,206.00 111.00,206.00 111.00,182.00 129.00,182.00" fill="#27c93f"/>
  <polygon points="85.35,195.38 72.62,182.65 89.59,165.68 102.32,178.41" fill="#27c93f"/>
  <polygon points="62.00,157.00 62.00,139.00 86.00,139.00 86.00,157.00" fill="#27c93f"/>
  <polygon points="72.62,113.35 85.35,100.62 102.32,117.59 89.59,130.32" fill="#27c93f"/>

  <!-- gear body -->
  <circle cx="120" cy="148" r="34" fill="#27c93f"/>
  <!-- center hole -->
  <circle cx="120" cy="148" r="14" fill="#0f1018"/>
</svg>
